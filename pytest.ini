# The experiment's own tests only. The trees below hold twin fixtures: modules that are
# meant to be executed inside a materialized workspace by lint_cases.py, never collected
# from here, where their imports do not resolve.
[pytest]
testpaths =
    test_analysis.py
    test_analysis_k3.py
    test_call_budget.py
    test_dose.py
    test_mechanism_subset.py
    test_recording.py
norecursedirs = authored historical cases payloads independent runs __pycache__
addopts = -q
